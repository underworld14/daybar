name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Release
        run: |
          xcodebuild -project DayBar.xcodeproj -scheme DayBar \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            build

      - name: Read version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create zip
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          cd build/DerivedData/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent DayBar.app "DayBar-v${VERSION}-macOS.zip"
          mv "DayBar-v${VERSION}-macOS.zip" "$GITHUB_WORKSPACE/"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DayBar-v${{ steps.version.outputs.tag }}-macOS.zip
          generate_release_notes: true
