<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Pixel cottage farm growing from focus sessions">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87c4e8"/>
      <stop offset="55%" stop-color="#c8e4f5"/>
      <stop offset="100%" stop-color="#e8f0c8"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#sky)"/>
  <ellipse class="cloud cloud-a" cx="180" cy="90" rx="70" ry="28" fill="#fff" opacity="0.85"/>
  <ellipse class="cloud cloud-a" cx="230" cy="90" rx="45" ry="22" fill="#fff" opacity="0.85"/>
  <ellipse class="cloud cloud-b" cx="720" cy="70" rx="80" ry="30" fill="#fff" opacity="0.8"/>
  <ellipse class="cloud cloud-b" cx="780" cy="70" rx="50" ry="22" fill="#fff" opacity="0.8"/>
  <ellipse cx="120" cy="320" rx="180" ry="60" fill="#6faf5a"/>
  <ellipse cx="400" cy="300" rx="220" ry="70" fill="#5f9e4c"/>
  <ellipse cx="780" cy="310" rx="200" ry="65" fill="#6faf5a"/>
  <rect x="0" y="340" width="960" height="200" fill="#5a8f3e"/>
  <rect x="0" y="420" width="960" height="120" fill="#4a6f2e"/>
  <!-- soil beds -->
  <rect x="220" y="400" width="70" height="36" rx="4" fill="#6b4423"/>
  <rect x="310" y="400" width="70" height="36" rx="4" fill="#6b4423"/>
  <rect x="400" y="400" width="70" height="36" rx="4" fill="#6b4423"/>
  <!-- crops -->
  <g class="crop">
    <rect x="248" y="378" width="8" height="28" fill="#3d8b4a"/>
    <circle cx="252" cy="372" r="10" fill="#e8c35a"/>
  </g>
  <g class="crop">
    <rect x="338" y="370" width="8" height="36" fill="#3d8b4a"/>
    <ellipse cx="342" cy="365" rx="14" ry="10" fill="#dfe8a8"/>
  </g>
  <g class="crop">
    <rect x="428" y="382" width="8" height="24" fill="#3d8b4a"/>
    <circle cx="424" cy="378" r="7" fill="#c23b5a"/>
    <circle cx="436" cy="374" r="7" fill="#c23b5a"/>
  </g>
  <!-- companion -->
  <g class="companion">
    <circle cx="560" cy="390" r="22" fill="#e8b86d"/>
    <circle cx="552" cy="385" r="3" fill="#fff"/>
    <circle cx="568" cy="385" r="3" fill="#fff"/>
    <circle cx="552.5" cy="385.5" r="1.5" fill="#333"/>
    <circle cx="568.5" cy="385.5" r="1.5" fill="#333"/>
    <rect x="548" y="398" width="24" height="5" rx="2" fill="#4a58e0"/>
  </g>
  <!-- fence -->
  <g fill="#8b5a2b">
    <rect x="200" y="388" width="6" height="48"/>
    <rect x="480" y="388" width="6" height="48"/>
    <rect x="200" y="396" width="286" height="5"/>
    <rect x="200" y="412" width="286" height="5"/>
  </g>
  <text x="480" y="500" text-anchor="middle" font-family="ui-rounded, system-ui, sans-serif" font-size="18" fill="#2a3a22" opacity="0.75">Focus sessions grow your garden</text>
</svg>
