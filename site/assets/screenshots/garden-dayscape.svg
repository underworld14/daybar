<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" shape-rendering="crispEdges">
  <rect width="560" height="420" fill="#e8f0d8"/>
  <rect x="48" y="36" width="464" height="348" rx="16" fill="#fff" stroke="rgba(60,60,67,0.12)"/>
  <text x="72" y="76" font-family="ui-rounded, system-ui, sans-serif" font-size="16" font-weight="700" fill="#1c1c1e">Focus garden</text>
  <text x="72" y="100" font-family="system-ui, sans-serif" font-size="12" fill="#636366">Pixel crops grow from Pomodoros — soft wilt, one grace day, cozy companion.</text>

  <!-- pixel sky strip -->
  <g transform="translate(72,128)">
    <rect width="320" height="56" fill="#a8d4ec"/>
    <rect x="20" y="8" width="24" height="8" fill="#fff"/>
    <rect x="28" y="4" width="16" height="6" fill="#fff"/>
    <rect x="200" y="12" width="28" height="8" fill="#fff"/>
    <rect y="44" width="320" height="12" fill="#5a8f3e"/>
    <!-- soils -->
    <rect x="24" y="36" width="40" height="20" fill="#6b4423"/>
    <rect x="28" y="38" width="4" height="14" fill="#54341c"/>
    <rect x="36" y="38" width="4" height="14" fill="#54341c"/>
    <rect x="80" y="36" width="40" height="20" fill="#6b4423"/>
    <rect x="136" y="36" width="40" height="20" fill="#6b4423"/>
    <!-- crops -->
    <rect x="36" y="18" width="8" height="20" fill="#3d8b4a"/>
    <rect x="28" y="10" width="24" height="16" fill="#e8c35a"/>
    <rect x="92" y="14" width="16" height="24" fill="#dfe8a8"/>
    <rect x="96" y="28" width="8" height="12" fill="#286434"/>
    <rect x="148" y="20" width="6" height="18" fill="#286434"/>
    <rect x="144" y="12" width="10" height="10" fill="#c23b5a"/>
    <rect x="154" y="14" width="10" height="10" fill="#c23b5a"/>
    <!-- companion -->
    <rect x="220" y="16" width="28" height="28" rx="2" fill="#e8b86d"/>
    <rect x="226" y="22" width="4" height="4" fill="#222"/>
    <rect x="238" y="22" width="4" height="4" fill="#222"/>
    <rect x="228" y="36" width="20" height="6" fill="#4a58e0"/>
  </g>

  <rect x="410" y="140" width="52" height="24" rx="12" fill="rgba(60,60,67,0.1)"/>
  <text x="436" y="157" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#636366" text-anchor="middle">12d</text>
  <text x="436" y="178" font-family="system-ui, sans-serif" font-size="11" fill="#636366" text-anchor="middle">18c</text>

  <rect x="72" y="220" width="416" height="88" rx="12" fill="#f4f7ef"/>
  <text x="92" y="252" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1c1c1e">Real pixel sprites</text>
  <text x="92" y="276" font-family="system-ui, sans-serif" font-size="13" fill="#636366">Nearest-neighbor scaled tiles — crisp crops, not blurry shapes.</text>

  <rect x="180" y="340" width="200" height="26" rx="8" fill="rgba(90,143,62,0.18)"/>
  <text x="280" y="358" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#3d6b2e" text-anchor="middle">Focus garden · pixel art</text>
</svg>
